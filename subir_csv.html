<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar CSV</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
                            <div class="container-fluid">
                                <a class="navbar-brand" href="index.html">
                                    <i data-lucide="home" class="me-2"></i>
                                    Inicio
                                </a>
                                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                                    <span class="navbar-toggler-icon"></span>
                                </button>
                                <div class="collapse navbar-collapse" id="navbarNav">
                                    <ul class="navbar-nav">
                                        <li class="nav-item">
                                            <a class="nav-link" href="subir_csv.html">
                                                <i data-lucide="upload" class="me-2"></i>
                                                Subir CSV
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </nav>
                        <h1 class="card-title text-center mb-4">Importar archivo CSV</h1>
                        <form id="csvForm" action="subir_csv.php" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="csvFile" class="form-label">Seleccione el archivo CSV:</label>
                                <input type="file" class="form-control" name="csvFile" id="csvFile" accept=".csv"
                                    required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="submitBtn">Subir e importar</button>
                            </div>
                        </form>
                        <div id="loadingIndicator" class="text-center mt-3 d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-2">Procesando archivo, por favor espere...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script>
        lucide.createIcons();
        document.getElementById('csvForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Show loading indicator
            document.getElementById('loadingIndicator').classList.remove('d-none');
            document.getElementById('submitBtn').disabled = true;

            // Submit the form
            this.submit();

            // Simulate processing time (you can remove this in production)
            setTimeout(function () {
                // Redirect to administracion.php
                window.location.href = 'administracion.php';
            }, 10000); // Redirect after 10 seconds (adjust as needed)
        });

    </script>

</body>

</html>
